services:
  - type: web
    name: tripsplit-planner
    runtime: node
    plan: free
    # NODE_ENV=production makes a plain `npm ci` skip devDependencies, but the
    # client build needs vite/tailwind/postcss (all devDependencies).
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: TRUST_PROXY
        value: "true"
      - key: ALLOW_EMBEDDED_MONGO
        value: "false"
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_ORIGIN
        sync: false

